<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlowCraft - レスポンシブ フローチャート ビルダー</title>
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, html {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .canvas-grid {
            background-size: 20px 20px;
            background-image: radial-gradient(circle, #cbd5e1 1.2px, transparent 1.2px);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .shape-parallelogram {
            transform: skewX(-15deg);
        }
        .shape-parallelogram-content {
            transform: skewX(15deg);
        }
    </style>
</head>
<body class="h-full w-full bg-slate-100 text-slate-800 flex flex-col font-sans select-none overflow-hidden">

    <header class="bg-white border-b border-slate-200 px-3 py-2 sm:px-4 sm:py-2.5 flex items-center justify-between z-20 shrink-0 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md shadow-indigo-100">
                <i data-lucide="git-fork" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-bold leading-none text-slate-800">FlowCraft</h1>
                <span class="text-[10px] sm:text-xs text-slate-500 hidden sm:inline">フローチャート エディター</span>
            </div>
        </div>

        <div class="flex items-center gap-1 sm:gap-2">
            <button id="btn-delete-selected" disabled class="px-2.5 py-1.5 sm:px-3 sm:py-2 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-xs sm:text-sm font-medium flex items-center gap-1.5 hover:bg-rose-100 active:bg-rose-200 disabled:opacity-40 disabled:pointer-events-none transition-all" title="選択中のノード/接続線を削除 (Delete / Backspace)">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                <span class="hidden md:inline">選択ノードを削除</span>
            </button>
            <div class="h-5 w-px bg-slate-200 mx-0.5"></div>
            <button id="btn-undo" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg disabled:opacity-30 transition-colors" title="元に戻す (Ctrl+Z)">
                <i data-lucide="undo-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </button>
            <button id="btn-redo" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg disabled:opacity-30 transition-colors" title="やり直す (Ctrl+Y)">
                <i data-lucide="redo-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </button>
            <div class="h-5 w-px bg-slate-200 mx-0.5"></div>
            <button id="btn-clear-all" class="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="キャンバスを全消去">
                <i data-lucide="rotate-ccw" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </button>
            <div class="h-5 w-px bg-slate-200 mx-0.5"></div>
            <div class="relative group">
                <button class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white px-2.5 py-1.5 sm:px-3.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium flex items-center gap-1.5 shadow-sm transition-colors">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>保存・共有</span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                </button>
                <div class="absolute right-0 top-full mt-1 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 hidden group-hover:block group-focus-within:block z-50">
                    <button id="export-png" class="w-full text-left px-4 py-2 text-xs sm:text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                        <i data-lucide="image" class="w-4 h-4 text-emerald-500"></i> PNG画像として保存
                    </button>
                    <button id="export-svg" class="w-full text-left px-4 py-2 text-xs sm:text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                        <i data-lucide="file-code" class="w-4 h-4 text-amber-500"></i> SVGファイルとして保存
                    </button>
                    <div class="border-t border-slate-100 my-1"></div>
                    <button id="export-json" class="w-full text-left px-4 py-2 text-xs sm:text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                        <i data-lucide="file-json" class="w-4 h-4 text-indigo-500"></i> JSON保存 (バックアップ)
                    </button>
                    <label class="w-full text-left px-4 py-2 text-xs sm:text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 cursor-pointer">
                        <i data-lucide="upload" class="w-4 h-4 text-sky-500"></i> JSON読み込み
                        <input type="file" id="import-json" accept=".json" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex relative overflow-hidden">
        <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 p-4 shrink-0 shadow-sm z-10 gap-4 overflow-y-auto">
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">ノードの追加</h2>
                <div class="grid grid-cols-2 gap-2.5">
                    <button class="add-node-btn flex flex-col items-center justify-center p-2.5 border border-slate-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50/50 transition-all text-slate-700 group" data-type="oval">
                        <div class="w-10 h-6 border-2 border-emerald-500 rounded-full bg-white group-hover:scale-105 transition-transform"></div>
                        <span class="text-xs mt-2 font-medium">開始 / 終了</span>
                    </button>
                    <button class="add-node-btn flex flex-col items-center justify-center p-2.5 border border-slate-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50/50 transition-all text-slate-700 group" data-type="rectangle">
                        <div class="w-10 h-6 border-2 border-indigo-500 rounded bg-white group-hover:scale-105 transition-transform"></div>
                        <span class="text-xs mt-2 font-medium">処理 (四角)</span>
                    </button>
                    <button class="add-node-btn flex flex-col items-center justify-center p-2.5 border border-slate-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50/50 transition-all text-slate-700 group" data-type="diamond">
                        <div class="w-6 h-6 border-2 border-amber-500 rotate-45 bg-white group-hover:scale-105 transition-transform"></div>
                        <span class="text-xs mt-2 font-medium">判断 (ひし形)</span>
                    </button>
                    <button class="add-node-btn flex flex-col items-center justify-center p-2.5 border border-slate-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50/50 transition-all text-slate-700 group" data-type="parallelogram">
                        <div class="w-10 h-6 border-2 border-sky-500 -skew-x-12 bg-white group-hover:scale-105 transition-transform"></div>
                        <span class="text-xs mt-2 font-medium">データ</span>
                    </button>
                    <button class="add-node-btn col-span-2 flex items-center justify-center gap-2 p-2.5 border border-slate-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50/50 transition-all text-slate-700 group" data-type="note">
                        <i data-lucide="sticky-note" class="w-5 h-5 text-purple-500"></i>
                        <span class="text-xs font-medium">テキストメモ</span>
                    </button>
                </div>
            </div>
            <hr class="border-slate-100">
            <div>
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">操作ガイド</h2>
                <ul class="text-xs text-slate-500 space-y-2">
                    <li class="flex items-start gap-1.5"><i data-lucide="pointer" class="w-3.5 h-3.5 mt-0.5 text-indigo-500 shrink-0"></i> <span><b>選択</b>: クリック/タップで選択</span></li>
                    <li class="flex items-start gap-1.5"><i data-lucide="trash-2" class="w-3.5 h-3.5 mt-0.5 text-rose-500 shrink-0"></i> <span><b>削除</b>: Deleteキーまたは上部ボタン</span></li>
                    <li class="flex items-start gap-1.5"><i data-lucide="move" class="w-3.5 h-3.5 mt-0.5 text-indigo-500 shrink-0"></i> <span><b>移動</b>: ドラッグして位置変更</span></li>
                    <li class="flex items-start gap-1.5"><i data-lucide="link-2" class="w-3.5 h-3.5 mt-0.5 text-indigo-500 shrink-0"></i> <span><b>接続</b>: 右端の円をドラッグ</span></li>
                    <li class="flex items-start gap-1.5"><i data-lucide="edit-3" class="w-3.5 h-3.5 mt-0.5 text-indigo-500 shrink-0"></i> <span><b>編集</b>: ダブルクリックでテキスト変更</span></li>
                </ul>
            </div>
        </aside>

        <main class="flex-1 relative h-full w-full bg-slate-50 canvas-grid overflow-hidden cursor-grab active:cursor-grabbing" id="canvas-container">
            <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
                    </marker>
                    <marker id="arrow-selected" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5" />
                    </marker>
                </defs>
                <g id="svg-group"></g>
                <path id="temp-connection" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-selected)" class="hidden"></path>
            </svg>
            <div id="nodes-container" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 origin-top-left"></div>

            <div class="md:hidden absolute bottom-20 right-4 z-30 flex flex-col items-end gap-2">
                <div id="mobile-palette" class="bg-white p-2 rounded-2xl shadow-xl border border-slate-200 flex flex-col gap-1.5 transition-all duration-200 scale-0 origin-bottom-right hidden">
                    <button class="add-node-btn p-2.5 bg-emerald-50 text-emerald-700 rounded-xl flex items-center gap-2 font-medium text-xs" data-type="oval">
                        <div class="w-4 h-2.5 border border-emerald-600 rounded-full"></div> 開始 / 終了
                    </button>
                    <button class="add-node-btn p-2.5 bg-indigo-50 text-indigo-700 rounded-xl flex items-center gap-2 font-medium text-xs" data-type="rectangle">
                        <div class="w-4 h-3 border border-indigo-600 rounded"></div> 処理 (四角)
                    </button>
                    <button class="add-node-btn p-2.5 bg-amber-50 text-amber-700 rounded-xl flex items-center gap-2 font-medium text-xs" data-type="diamond">
                        <div class="w-3 h-3 border border-amber-600 rotate-45"></div> 判断 (ひし形)
                    </button>
                    <button class="add-node-btn p-2.5 bg-sky-50 text-sky-700 rounded-xl flex items-center gap-2 font-medium text-xs" data-type="parallelogram">
                        <div class="w-4 h-3 border border-sky-600 -skew-x-12"></div> データ
                    </button>
                    <button class="add-node-btn p-2.5 bg-purple-50 text-purple-700 rounded-xl flex items-center gap-2 font-medium text-xs" data-type="note">
                        <i data-lucide="sticky-note" class="w-4 h-4 text-purple-600"></i> メモ
                    </button>
                </div>
                <button id="btn-toggle-mobile-palette" class="w-12 h-12 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="absolute bottom-4 right-4 z-20 bg-white border border-slate-200 rounded-xl shadow-lg flex items-center p-1 gap-1">
                <button id="btn-zoom-out" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600" title="縮小">
                    <i data-lucide="zoom-out" class="w-4 h-4"></i>
                </button>
                <span id="zoom-value" class="text-xs font-semibold px-1.5 text-slate-600 min-w-[3rem] text-center">100%</span>
                <button id="btn-zoom-in" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600" title="拡大">
                    <i data-lucide="zoom-in" class="w-4 h-4"></i>
                </button>
                <div class="h-4 w-px bg-slate-200 mx-0.5"></div>
                <button id="btn-zoom-reset" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600" title="表示リセット">
                    <i data-lucide="maximize-2" class="w-4 h-4"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- ノード詳細編集モーダル -->
    <div id="node-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white w-11/12 sm:max-w-md rounded-2xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5 text-indigo-600"></i>
                    <span>ノードの編集</span>
                </h3>
                <button id="btn-close-modal" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">表示テキスト</label>
                    <textarea id="node-text-input" rows="3" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none" placeholder="テキストを入力..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">背景カラー</label>
                    <div class="flex items-center gap-2.5 flex-wrap" id="color-palette"></div>
                </div>
                <div class="pt-2 flex items-center justify-between gap-3">
                    <button id="btn-modal-delete" class="flex-1 py-2.5 border border-rose-200 text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5 transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> 削除
                    </button>
                    <button id="btn-save-node" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-md shadow-indigo-100">
                        <i data-lucide="check" class="w-4 h-4"></i> 保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = {
            nodes: [], connections: [], scale: 1, pan: { x: 0, y: 0 },
            selectedNodeId: null, selectedConnectionId: null, editingNodeId: null,
            editingColorIdx: 0, history: [], historyIndex: -1, isConnecting: false, connectingStartNodeId: null
        };

        const COLORS = [
            { name: 'Indigo', bg: '#e0e7ff', border: '#6366f1', text: '#3730a3' },
            { name: 'Emerald', bg: '#d1fae5', border: '#10b981', text: '#065f46' },
            { name: 'Amber', bg: '#fef3c7', border: '#f59e0b', text: '#92400e' },
            { name: 'Sky', bg: '#e0f2fe', border: '#0ea5e9', text: '#075985' },
            { name: 'Purple', bg: '#f3e8ff', border: '#a855f7', text: '#6b21a8' },
            { name: 'White', bg: '#ffffff', border: '#cbd5e1', text: '#1e293b' }
        ];

        const container = document.getElementById('canvas-container');
        const nodesContainer = document.getElementById('nodes-container');
        const svgGroup = document.getElementById('svg-group');
        const tempConnection = document.getElementById('temp-connection');
        const zoomValueEl = document.getElementById('zoom-value');
        const modal = document.getElementById('node-modal');
        const nodeTextInput = document.getElementById('node-text-input');
        const btnDeleteSelected = document.getElementById('btn-delete-selected');

        function init() {
            lucide.createIcons();
            setupColorPalette();
            setupEventListeners();
            loadFromLocalStorage();
            if (state.nodes.length === 0) createDefaultFlowchart();
            saveState();
            render();
        }

        function createDefaultFlowchart() {
            const startNode = createNode('oval', 140, 100, '処理開始', 1);
            const dataNode = createNode('parallelogram', 140, 210, '入力データ読込', 3);
            const processNode = createNode('rectangle', 140, 320, 'データ処理を実行', 0);
            const decisionNode = createNode('diamond', 140, 440, '正常完了?', 2);
            const endNode = createNode('oval', 140, 570, '終了', 1);

            state.connections.push(
                { id: generateId(), from: startNode.id, to: dataNode.id },
                { id: generateId(), from: dataNode.id, to: processNode.id },
                { id: generateId(), from: processNode.id, to: decisionNode.id },
                { id: generateId(), from: decisionNode.id, to: endNode.id }
            );
        }

        function generateId() { return 'id_' + Math.random().toString(36).substr(2, 9); }

        function setupColorPalette() {
            const colorPaletteContainer = document.getElementById('color-palette');
            colorPaletteContainer.innerHTML = '';
            COLORS.forEach((color, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-8 h-8 rounded-full border-2 transition-all color-btn flex items-center justify-center`;
                btn.style.backgroundColor = color.bg;
                btn.style.borderColor = color.border;
                btn.onclick = () => selectColorInPalette(idx);
                colorPaletteContainer.appendChild(btn);
            });
        }

        function selectColorInPalette(idx) {
            state.editingColorIdx = idx;
            document.querySelectorAll('.color-btn').forEach((b, i) => {
                if (i === idx) b.classList.add('scale-125', 'ring-2', 'ring-indigo-500', 'shadow-md');
                else b.classList.remove('scale-125', 'ring-2', 'ring-indigo-500', 'shadow-md');
            });
        }

        function createNode(type, x, y, text = '', colorIdx = 0) {
            const defaultTexts = { oval: '開始 / 終了', rectangle: '処理手順', diamond: '条件分岐', parallelogram: 'データ入出力', note: 'メモテキスト' };
            const node = {
                id: generateId(), type: type, x: x, y: y,
                width: type === 'diamond' ? 120 : (type === 'note' ? 130 : 140),
                height: type === 'diamond' ? 80 : 60,
                text: text || defaultTexts[type] || 'ノード', colorIdx: colorIdx
            };
            state.nodes.push(node);
            return node;
        }

        function render() {
            nodesContainer.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.scale})`;
            svgGroup.setAttribute('transform', `translate(${state.pan.x}, ${state.pan.y}) scale(${state.scale})`);
            zoomValueEl.textContent = `${Math.round(state.scale * 100)}%`;
            updateDeleteButtonState();
            renderNodes();
            renderConnections();
        }

        function updateDeleteButtonState() {
            btnDeleteSelected.disabled = !(state.selectedNodeId || state.selectedConnectionId);
        }

        function renderNodes() {
            nodesContainer.innerHTML = '';
            state.nodes.forEach(node => {
                const isSelected = state.selectedNodeId === node.id;
                const el = document.createElement('div');
                el.dataset.nodeId = node.id;
                el.className = `node-element absolute pointer-events-auto flex items-center justify-center text-center p-2 cursor-move transition-shadow ${
                    isSelected ? 'ring-4 ring-indigo-500 ring-offset-2 shadow-xl z-20' : 'shadow-md hover:shadow-lg z-10'
                }`;
                el.style.left = `${node.x}px`;
                el.style.top = `${node.y}px`;
                el.style.width = `${node.width}px`;
                el.style.height = `${node.height}px`;

                const color = COLORS[node.colorIdx] || COLORS[0];
                el.style.backgroundColor = color.bg;
                el.style.borderColor = color.border;
                el.style.color = color.text;
                el.style.borderWidth = '2px';

                if (node.type === 'oval') el.style.borderRadius = '9999px';
                else if (node.type === 'diamond') { el.style.borderRadius = '8px'; el.style.transform = 'rotate(45deg)'; }
                else if (node.type === 'parallelogram') { el.classList.add('shape-parallelogram'); el.style.borderRadius = '6px'; }
                else if (node.type === 'note') { el.style.borderRadius = '4px'; el.style.borderStyle = 'dashed'; }
                else el.style.borderRadius = '12px';

                const textEl = document.createElement('div');
                textEl.className = 'font-medium text-xs sm:text-sm select-none break-words w-full px-1 line-clamp-3 leading-snug pointer-events-none';
                if (node.type === 'diamond') textEl.style.transform = 'rotate(-45deg)';
                else if (node.type === 'parallelogram') textEl.classList.add('shape-parallelogram-content');
                textEl.textContent = node.text;
                el.appendChild(textEl);

                const handle = document.createElement('div');
                handle.className = 'absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 bg-white border-2 border-indigo-600 rounded-full cursor-crosshair hover:scale-125 transition-transform shadow-sm flex items-center justify-center z-30 connect-handle';
                if (node.type === 'diamond') handle.style.transform = 'rotate(-45deg) translate(10px, -10px)';
                handle.dataset.nodeId = node.id;
                el.appendChild(handle);

                setupNodeEvents(el, node);
                nodesContainer.appendChild(el);
            });
        }

        function renderConnections() {
            svgGroup.innerHTML = '';
            state.connections.forEach(conn => {
                const fromNode = state.nodes.find(n => n.id === conn.from);
                const toNode = state.nodes.find(n => n.id === conn.to);
                if (!fromNode || !toNode) return;

                const isSelected = state.selectedConnectionId === conn.id;
                const start = { x: fromNode.x + fromNode.width / 2, y: fromNode.y + fromNode.height / 2 };
                const end = { x: toNode.x + toNode.width / 2, y: toNode.y + toNode.height / 2 };
                const controlX = start.x + (end.x - start.x) / 2;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${start.x} ${start.y} C ${controlX} ${start.y}, ${controlX} ${end.y}, ${end.x} ${end.y}`);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', isSelected ? '#4f46e5' : '#64748b');
                path.setAttribute('stroke-width', isSelected ? '4' : '2.5');
                path.setAttribute('marker-end', isSelected ? 'url(#arrow-selected)' : 'url(#arrow)');
                path.classList.add('pointer-events-auto', 'cursor-pointer');

                path.onclick = (e) => {
                    e.stopPropagation();
                    state.selectedConnectionId = conn.id;
                    state.selectedNodeId = null;
                    render();
                };
                svgGroup.appendChild(path);
            });
        }

        function updateTempConnection(clientX, clientY) {
            if (!state.isConnecting || !state.connectingStartNodeId) return;
            const startNode = state.nodes.find(n => n.id === state.connectingStartNodeId);
            if (!startNode) return;

            const startX = startNode.x + startNode.width / 2;
            const startY = startNode.y + startNode.height / 2;
            const rect = container.getBoundingClientRect();
            const endX = (clientX - rect.left - state.pan.x) / state.scale;
            const endY = (clientY - rect.top - state.pan.y) / state.scale;
            const controlX = startX + (endX - startX) / 2;

            tempConnection.setAttribute('d', `M ${startX} ${startY} C ${controlX} ${startX > endX ? startY : startY}, ${controlX} ${endY}, ${endX} ${endY}`);
            tempConnection.setAttribute('transform', `translate(${state.pan.x}, ${state.pan.y}) scale(${state.scale})`);
            tempConnection.classList.remove('hidden');
        }

        let isDraggingNode = false;
        let draggedNode = null;
        let dragOffset = { x: 0, y: 0 };
        let hasDragged = false;
        
        let lastNodeClickTime = 0;
        let lastNodeClickId = null;

        function setupNodeEvents(el, node) {
            const handleInteract = (clientX, clientY, target) => {
                hasDragged = false;
                
                const now = Date.now();
                if (lastNodeClickId === node.id && (now - lastNodeClickTime) < 300) {
                    openEditModal(node);
                    lastNodeClickId = null;
                    return;
                }
                lastNodeClickTime = now;
                lastNodeClickId = node.id;

                if (target.classList.contains('connect-handle')) {
                    state.isConnecting = true;
                    state.connectingStartNodeId = node.id;
                    document.querySelectorAll('.node-element').forEach(n => n.style.pointerEvents = 'none');
                    updateTempConnection(clientX, clientY);
                    return;
                }

                state.selectedNodeId = node.id;
                state.selectedConnectionId = null;
                
                isDraggingNode = true;
                draggedNode = node;
                dragOffset.x = (clientX - state.pan.x) / state.scale - node.x;
                dragOffset.y = (clientY - state.pan.y) / state.scale - node.y;

                render();
            };

            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.stopPropagation();
                handleInteract(e.clientX, e.clientY, e.target);
            });

            el.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                if (e.touches.length === 1) {
                    handleInteract(e.touches[0].clientX, e.touches[0].clientY, e.target);
                }
            }, { passive: true });
        }

        let isPanning = false;
        let panStart = { x: 0, y: 0 };

        container.addEventListener('mousedown', (e) => {
            if (e.target === container || e.target.id === 'svg-layer' || e.target.id === 'nodes-container') {
                state.selectedNodeId = null;
                state.selectedConnectionId = null;
                isPanning = true;
                panStart.x = e.clientX - state.pan.x;
                panStart.y = e.clientY - state.pan.y;
                render();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (state.isConnecting) {
                updateTempConnection(e.clientX, e.clientY);
            } else if (isDraggingNode && draggedNode) {
                hasDragged = true;
                draggedNode.x = (e.clientX - state.pan.x) / state.scale - dragOffset.x;
                draggedNode.y = (e.clientY - state.pan.y) / state.scale - dragOffset.y;
                render();
            } else if (isPanning) {
                state.pan.x = e.clientX - panStart.x;
                state.pan.y = e.clientY - panStart.y;
                render();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDraggingNode) { isDraggingNode = false; draggedNode = null; saveState(); }
            if (isPanning) isPanning = false;
            
            if (state.isConnecting) {
                tempConnection.classList.add('hidden');
                document.querySelectorAll('.node-element').forEach(n => n.style.pointerEvents = 'auto');

                const targetEl = document.elementFromPoint(e.clientX, e.clientY);
                const targetNodeEl = targetEl?.closest('[data-node-id]');
                
                if (targetNodeEl) {
                    const targetNodeId = targetNodeEl.dataset.nodeId;
                    if (targetNodeId && targetNodeId !== state.connectingStartNodeId) {
                        const exists = state.connections.some(c => c.from === state.connectingStartNodeId && c.to === targetNodeId);
                        if (!exists) {
                            state.connections.push({ id: generateId(), from: state.connectingStartNodeId, to: targetNodeId });
                            saveState();
                        }
                    }
                }
                state.isConnecting = false;
                state.connectingStartNodeId = null;
                render();
            }
        });

        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && (e.target === container || e.target.id === 'svg-layer')) {
                state.selectedNodeId = null;
                state.selectedConnectionId = null;
                isPanning = true;
                panStart.x = e.touches[0].clientX - state.pan.x;
                panStart.y = e.touches[0].clientY - state.pan.y;
                render();
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                if (state.isConnecting) {
                    updateTempConnection(touch.clientX, touch.clientY);
                } else if (isDraggingNode && draggedNode) {
                    hasDragged = true;
                    draggedNode.x = (touch.clientX - state.pan.x) / state.scale - dragOffset.x;
                    draggedNode.y = (touch.clientY - state.pan.y) / state.scale - dragOffset.y;
                    render();
                } else if (isPanning) {
                    state.pan.x = touch.clientX - panStart.x;
                    state.pan.y = touch.clientY - panStart.y;
                    render();
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (isDraggingNode) { isDraggingNode = false; draggedNode = null; saveState(); }
            if (isPanning) isPanning = false;

            if (state.isConnecting) {
                tempConnection.classList.add('hidden');
                document.querySelectorAll('.node-element').forEach(n => n.style.pointerEvents = 'auto');

                const touch = e.changedTouches[0];
                if (touch) {
                    const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                    const targetNodeEl = targetEl?.closest('[data-node-id]');
                    if (targetNodeEl) {
                        const targetNodeId = targetNodeEl.dataset.nodeId;
                        if (targetNodeId && targetNodeId !== state.connectingStartNodeId) {
                            const exists = state.connections.some(c => c.from === state.connectingStartNodeId && c.to === targetNodeId);
                            if (!exists) {
                                state.connections.push({ id: generateId(), from: state.connectingStartNodeId, to: targetNodeId });
                                saveState();
                            }
                        }
                    }
                }
                state.isConnecting = false;
                state.connectingStartNodeId = null;
                render();
            }
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const newScale = Math.min(Math.max(0.3, state.scale * zoomFactor), 2.5);
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            state.pan.x = mouseX - (mouseX - state.pan.x) * (newScale / state.scale);
            state.pan.y = mouseY - (mouseY - state.pan.y) * (newScale / state.scale);
            state.scale = newScale;
            render();
        }, { passive: false });

        function deleteSelected() {
            const targetId = state.selectedNodeId || state.editingNodeId;
            if (targetId) {
                state.nodes = state.nodes.filter(n => n.id !== targetId);
                state.connections = state.connections.filter(c => c.from !== targetId && c.to !== targetId);
                state.selectedNodeId = null; state.editingNodeId = null;
                saveState(); render();
            } else if (state.selectedConnectionId) {
                state.connections = state.connections.filter(c => c.id !== state.selectedConnectionId);
                state.selectedConnectionId = null;
                saveState(); render();
            }
        }

        btnDeleteSelected.onclick = () => deleteSelected();

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                deleteSelected();
            }
        });

        function openEditModal(node) {
            state.editingNodeId = node.id;
            state.selectedNodeId = node.id;
            nodeTextInput.value = node.text;
            selectColorInPalette(node.colorIdx || 0);
            modal.classList.remove('hidden');
            setTimeout(() => nodeTextInput.focus(), 50);
            render();
        }

        function closeModal() {
            modal.classList.add('hidden');
            state.editingNodeId = null;
        }

        document.getElementById('btn-close-modal').onclick = closeModal;
        document.getElementById('btn-save-node').onclick = () => {
            const node = state.nodes.find(n => n.id === state.editingNodeId);
            if (node) {
                node.text = nodeTextInput.value;
                node.colorIdx = state.editingColorIdx;
                saveState(); render();
            }
            closeModal();
        };
        document.getElementById('btn-modal-delete').onclick = () => { deleteSelected(); closeModal(); };

        document.getElementById('btn-zoom-in').onclick = () => { state.scale = Math.min(2.5, state.scale * 1.2); render(); };
        document.getElementById('btn-zoom-out').onclick = () => { state.scale = Math.max(0.3, state.scale / 1.2); render(); };
        document.getElementById('btn-zoom-reset').onclick = () => { state.scale = 1; state.pan = { x: 0, y: 0 }; render(); };

        document.querySelectorAll('.add-node-btn').forEach(btn => {
            btn.onclick = () => {
                const rect = container.getBoundingClientRect();
                const newNode = createNode(btn.dataset.type, (rect.width / 2 - state.pan.x) / state.scale - 60, (rect.height / 2 - state.pan.y) / state.scale - 30);
                state.selectedNodeId = newNode.id; state.selectedConnectionId = null;
                saveState(); render();
                const palette = document.getElementById('mobile-palette');
                if (palette) palette.classList.add('hidden', 'scale-0');
            };
        });

        const btnToggleMobile = document.getElementById('btn-toggle-mobile-palette');
        if (btnToggleMobile) {
            btnToggleMobile.onclick = () => {
                const palette = document.getElementById('mobile-palette');
                if (palette.classList.contains('hidden')) {
                    palette.classList.remove('hidden');
                    setTimeout(() => palette.classList.remove('scale-0'), 10);
                } else {
                    palette.classList.add('scale-0');
                    setTimeout(() => palette.classList.add('hidden'), 200);
                }
            };
        }

        function saveState() {
            const currentData = JSON.stringify({ nodes: state.nodes, connections: state.connections });
            if (state.historyIndex < 0 || state.history[state.historyIndex] !== currentData) {
                state.history = state.history.slice(0, state.historyIndex + 1);
                state.history.push(currentData);
                state.historyIndex++;
            }
            localStorage.setItem('flowcraft_data', currentData);
            document.getElementById('btn-undo').disabled = state.historyIndex <= 0;
            document.getElementById('btn-redo').disabled = state.historyIndex >= state.history.length - 1;
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem('flowcraft_data');
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    state.nodes = parsed.nodes || []; state.connections = parsed.connections || [];
                } catch (e) { console.error(e); }
            }
        }

        document.getElementById('btn-undo').onclick = () => {
            if (state.historyIndex > 0) {
                const parsed = JSON.parse(state.history[--state.historyIndex]);
                state.nodes = parsed.nodes; state.connections = parsed.connections;
                state.selectedNodeId = null; state.selectedConnectionId = null;
                render(); document.getElementById('btn-undo').disabled = state.historyIndex <= 0;
                document.getElementById('btn-redo').disabled = false;
            }
        };

        document.getElementById('btn-redo').onclick = () => {
            if (state.historyIndex < state.history.length - 1) {
                const parsed = JSON.parse(state.history[++state.historyIndex]);
                state.nodes = parsed.nodes; state.connections = parsed.connections;
                state.selectedNodeId = null; state.selectedConnectionId = null;
                render(); document.getElementById('btn-redo').disabled = state.historyIndex >= state.history.length - 1;
                document.getElementById('btn-undo').disabled = false;
            }
        };

        document.getElementById('btn-clear-all').onclick = () => {
            if (confirm('すべてのノードと接続を消去しますか？')) {
                state.nodes = []; state.connections = [];
                state.selectedNodeId = null; state.selectedConnectionId = null;
                saveState(); render();
            }
        };

        document.getElementById('export-json').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ nodes: state.nodes, connections: state.connections }, null, 2));
            const a = document.createElement('a');
            a.href = dataStr; a.download = `flowchart_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a); a.click(); a.remove();
        };

        document.getElementById('import-json').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    state.nodes = parsed.nodes || []; state.connections = parsed.connections || [];
                    state.selectedNodeId = null; state.selectedConnectionId = null;
                    saveState(); render();
                } catch (err) { alert('無効なJSONファイルです。'); }
            };
            reader.readAsText(file);
        };

        document.getElementById('export-png').onclick = () => {
            if (state.nodes.length === 0) return;
            const exportCanvas = document.createElement('canvas');
            const ctx = exportCanvas.getContext('2d');
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.nodes.forEach(n => {
                minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + n.width); maxY = Math.max(maxY, n.y + n.height);
            });
            const padding = 60, width = maxX - minX + padding * 2, height = maxY - minY + padding * 2;
            exportCanvas.width = width; exportCanvas.height = height;
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);

            state.connections.forEach(conn => {
                const fromNode = state.nodes.find(n => n.id === conn.from), toNode = state.nodes.find(n => n.id === conn.to);
                if (!fromNode || !toNode) return;
                const start = { x: fromNode.x + fromNode.width / 2 - minX + padding, y: fromNode.y + fromNode.height / 2 - minY + padding };
                const end = { x: toNode.x + toNode.width / 2 - minX + padding, y: toNode.y + toNode.height / 2 - minY + padding };
                ctx.beginPath(); ctx.moveTo(start.x, start.y);
                const controlX = start.x + (end.x - start.x) / 2;
                ctx.bezierCurveTo(controlX, start.y, controlX, end.y, end.x, end.y);
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2.5; ctx.stroke();
            });

            state.nodes.forEach(node => {
                const x = node.x - minX + padding, y = node.y - minY + padding, color = COLORS[node.colorIdx] || COLORS[0];
                ctx.fillStyle = color.bg; ctx.strokeStyle = color.border; ctx.lineWidth = 2;
                if (node.type === 'oval') { ctx.beginPath(); ctx.roundRect(x, y, node.width, node.height, 999); ctx.fill(); ctx.stroke(); }
                else if (node.type === 'diamond') {
                    ctx.save(); ctx.translate(x + node.width / 2, y + node.height / 2); ctx.rotate(45 * Math.PI / 180);
                    ctx.fillRect(-node.width / 2, -node.height / 2, node.width, node.height);
                    ctx.strokeRect(-node.width / 2, -node.height / 2, node.width, node.height); ctx.restore();
                } else { ctx.beginPath(); ctx.roundRect(x, y, node.width, node.height, 8); ctx.fill(); ctx.stroke(); }
                ctx.fillStyle = color.text; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(node.text, x + node.width / 2, y + node.height / 2);
            });
            const link = document.createElement('a');
            link.download = `flowchart_${new Date().toISOString().slice(0, 10)}.png`;
            link.href = exportCanvas.toDataURL(); link.click();
        };

        function setupEventListeners() { window.addEventListener('resize', () => render()); }
        window.onload = init;
    </script>
</body>
</html>
